[package]
name = "Spool"
version = "0.1.0"
edition = "2021"

[dependencies]
# The vendored figcraft engine. See vendor/figcraft/UPSTREAM.md.
figcraft-doc = { workspace = true }
figcraft-render = { workspace = true }
figcraft-geom = { workspace = true }
# Spool's source-backed layer. It owns the lamine.yaml schema and the
# source -> engine compile; app calls it rather than keeping a second one.
spool-source = { path = "../crates/spool-source" }
image = { workspace = true }
tiny-skia = { workspace = true }
# Pinned in the manifest, not only in Cargo.lock. An unpinned git dependency
# tracks whatever the remote default branch happens to be, so deleting or
# regenerating the lockfile silently upgrades the entire GPUI tree. This
# revision is the one Spool was locked to before the workspace move.
gpui = { git = "https://github.com/zed-industries/zed", rev = "397cbc84de333eeb56849dc90782d365b37e60d7" }
gpui_platform = {
    git = "https://github.com/zed-industries/zed",
    rev = "397cbc84de333eeb56849dc90782d365b37e60d7",
    features = ["font-kit"]
}
serde_json = "1"
tree-sitter = "0.27.0"
tree-sitter-html = "0.23.2"
# smallvec is included here for convenience, it is used by gpui when creating
# components that can have children. uncomment this line or
# use `cargo add smallvec` and it will be added to the project
#smallvec = "1.13.2"

# GPUI's own test facility, for dev only.
#
# Focus, key dispatch, and text sessions are properties of a live `Window`, and
# every one of them is the kind of behaviour that looks right in a unit test
# because the unit test is holding the `Window` that does the work. `test-support`
# is what lets a test drive a real window: `VisualTestContext` renders, clicks,
# and types through the same code path the app does.
#
# Declared as a dev-dependency rather than a feature on the dependency above so
# the flag cannot reach the shipped binary. Cargo unifies features across a
# build, but a dev-dependency is only in the graph for `cargo test`.
[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "397cbc84de333eeb56849dc90782d365b37e60d7", features = ["test-support"] }
